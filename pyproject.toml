[project]
name = "identityguard-agent-platform"
version = "0.2.0"
description = "Python/FastAPI agent harness with LangGraph, durable execution, tenant-isolated memory, policy-gated identity operations, human approvals, verified tool outcomes, and replayable LLM security evaluations."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jatinder Singh" }]
dependencies = [
  "langgraph==1.2.16",
  "langgraph-checkpoint-sqlite==3.1.2",
  "fastapi",
  "uvicorn",
  "httpx",
  "psycopg[binary]",
  "prometheus-client",
  "opentelemetry-sdk",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "locust"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
